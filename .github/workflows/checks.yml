name: Deployment checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n core-ai scripts/*.sh
      - name: Install Caddy for regression validation
        run: sudo apt-get update && sudo apt-get install -y caddy
      - name: Deployment behavior
        run: python3 -m unittest discover -s tests -v
      - name: Compose validation
        run: docker compose --env-file /dev/null config --quiet
      - name: PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Path setup.ps1,scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
