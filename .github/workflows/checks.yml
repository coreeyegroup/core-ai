name: Workstation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: core_ai_test
          POSTGRES_PASSWORD: core_ai_ci_only
          POSTGRES_DB: core_ai_test
        ports: ['55434:5432']
        options: >-
          --health-cmd "pg_isready -U core_ai_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CORE_AI_DATABASE_URL: postgresql://core_ai_test:core_ai_ci_only@127.0.0.1:55434/core_ai_test
      CORE_AI_ORIGIN: http://testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: python -m pip install -e './backend[test]'
      - run: python -m pytest backend/tests tests -q
      - run: npm ci --prefix ui && npm run build --prefix ui && npm test --prefix ui
      - run: bash -n core-ai scripts/*.sh
      - run: sudo apt-get update && sudo apt-get install -y caddy
      - run: python tests/validate_caddy.py
      - name: Native Ubuntu installer smoke test
        run: bash tests/install-smoke.sh
