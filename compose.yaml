name: core-ai
services:
  app:
    image: mintplexlabs/anythingllm:1.20.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3101:3001"
    environment:
      STORAGE_DIR: /app/server/storage
      SERVER_PORT: "3001"
      DISABLE_TELEMETRY: "true"
      ENABLE_BUILT_IN_LLM: "false"
    volumes:
      - ./data-anythingllm:/app/server/storage
      - ./runtime/anythingllm.env:/app/server/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
